<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Summary App</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        input, button {
            margin: 10px 0;
            max-width: 100%;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 350px;
            padding: 12px;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>PDF Summary App</h1>
    <p>Upload a PDF to extract its text. Maximum upload: 10 MB.</p>

    <form method="POST" enctype="multipart/form-data">
        <label for="pdf">Choose a PDF:</label>
        <br>
        <input
            type="file"
            id="pdf"
            name="pdf"
            accept=".pdf,application/pdf"
            required
        >
        <br>
        <button type="submit">Extract text</button>
    </form>

    {% if error %}
        <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    {% if text %}
        <h2>Extracted text</h2>
        <label for="extracted-text">Your PDF's text:</label>
        <textarea id="extracted-text" readonly>{{ text }}</textarea>
    {% endif %}
</body>
</html>
